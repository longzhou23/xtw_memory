name: Minimal memory tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline test dependency
        run: python -m pip install "numpy>=1.24,<3"
      - name: Synthetic offline contract tests
        working-directory: research-mvp
        env:
          PYTHONPATH: .:../router_deploy
        run: python -m unittest discover -s tests -t . -v
